[project]
name = "veranico"
version = "0.1.0"
description = "Parametric rainfall cover agent for Brazilian agriculture"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "gcsfs>=2026.7.0",
    "google-auth[requests]>=2.62.2",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "google-cloud-tasks>=2.26.0",
    "h3>=4.5.0",
    "h5netcdf>=1.8.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "reportlab>=5.1.0",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cube = [
    "cdsapi>=0.7.7",
]
dev = [
    "import-linter>=2.16",
    "inspect-ai>=0.3.289",
    "mypy>=2.4.1",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20261103",
    "types-reportlab>=5.1.0.20261104",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import order
    "N",     # naming
    "UP",    # idioms of the target Python version
    "B",     # likely bugs
    "C4",    # comprehensions
    "SIM",   # simplifications
    "PT",    # pytest style
    "DTZ",   # naive datetimes: every datetime is timezone-aware UTC
    "ASYNC", # blocking calls in async code
    "RUF",   # ruff's own rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These packages ship neither a py.typed marker nor a stub package.
module = [
    "cdsapi.*",
    "fsspec.*",
    "gcsfs.*",
    "google.cloud.storage.*",
    "h3.*",
    "h5netcdf.*",
    "opentelemetry.exporter.cloud_trace.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "req(id): identifier of the requirement in tests/requirements.yaml that the test proves",
    "integration: needs the Firestore and Cloud Storage emulators",
    "failure: part of the failure campaign",
    "live: touches a public network service",
    "slow: a benchmark, excluded from mutation runs",
    "external: shells out to a tool outside the Python environment, such as terraform",
]

[tool.importlinter]
root_package = "veranico"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared-below-modules: shared code imports no module"
id = "shared-below-modules"
type = "forbidden"
source_modules = ["veranico.shared"]
forbidden_modules = ["veranico.modules"]
