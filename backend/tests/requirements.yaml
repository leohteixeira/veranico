  plan: '00'
- id: R-3.1-2
  section: '3.1'
  text: Module `climate` may import the contracts of `access`.
  plan: '00'
- id: R-3.1-3
  section: '3.1'
  text: Module `pricing` may import the contracts of `climate`.
  plan: '00'
- id: R-3.1-4
  section: '3.1'
  text: Module `quoting` may import the contracts of `pricing`, `climate` and `access`.
  plan: '00'
- id: R-3.1-5
  section: '3.1'
  text: Module `carriers` may import the contracts of `quoting`.
  plan: '00'
- id: R-3.1-6
