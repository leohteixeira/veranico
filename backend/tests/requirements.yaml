  text: Development uses `compose.yaml` with the API, the carrier role, the Vite dev server, the Firestore and Cloud Storage emulators and Jaeger on ports 3500, 8500, 8510, 8516, 8580 and 8590; the failure campaign adds a fault proxy in a separate Compose profile on 8520 and 8521.
  plan: 00, 09
