  plan: '00'
- id: R-3.1-9
  section: '3.1'
  text: Inside a module, folders are layered (`domain/`, `application/`, `infrastructure/`, `http/`, `module.py`), dependencies point inward, and `domain/` uses only the standard library, the shared kernel, NumPy and SciPy, with no framework, SDK or I/O.
