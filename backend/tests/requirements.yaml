- id: R-17-2
  section: '17'
  text: 'Terraform (Google provider) declares everything in `us-central1`: Artifact Registry with a cleanup policy keeping the last 3 images, two Cloud Run services (min 0, max 2 instances each), Firestore in Native mode with TTL policies, one Cloud Storage bucket, a Cloud Tasks queue with the retry policy, one Cloud Scheduler job for the outbox sweep, the Secret Manager entries, least-privilege service accounts per role, Workload Identity Federation for GitHub Actions, the uptime check and a billing budget with email alerts.'
  plan: 09
- id: R-17-3
  section: '17'
  text: 'Terraform tests assert the guardrails: instance limits, region, no public bucket, cleanup policy, no JSON keys.'
  plan: 09
- id: R-17-4
  section: '17'
  text: The address is the Cloud Run URL first; `veranico.leohteixeira.com` is an optional later mapping.
  plan: 09
- id: R-17-5
  section: '17'
  text: Earth Engine credentials and project are used only by the offline cube build and never reach the running service.
  plan: 01, 09
- id: R-17-6
  section: '17'
  text: 'Graceful shutdown: readiness turns false on SIGTERM and open streams end with a final event.'
  plan: 00, 06
- id: R-17-7
  section: '17'
  text: '`ci.yml` runs on every push and pull request: lint, types, architecture checks, unit and integration tests, failure tests, mutation proof, frontend build and tests, `terraform fmt -check`, `terraform validate`, `terraform test` and gitleaks.'
  plan: 09
- id: R-17-8
  section: '17'
  text: '`evals.yml` runs the agent evaluation of section 16.6, `load.yml` runs on demand, and `deploy.yml` on tags matching `v*.*.*` builds, pushes and runs `terraform apply` with the new image tag.'
  plan: 09
- id: R-17-9
