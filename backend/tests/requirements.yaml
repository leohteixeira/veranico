# Requirements of docs/SPEC.md, one entry per normative statement of sections 2 to 17, plus
# the disclaimer of section 1. Tests name them with `@pytest.mark.req("<id>")` and
# `scripts/traceability.py` builds the matrix.
#
# id: `R-<spec section>-<n>`. Where a plan carries an identifier table for a section, its
# identifiers and statements are copied here as written (sections 4 to 10, 12, 13, 16.4,
# 16.6 and 16.7). Everywhere else `n` is the position of the bullet, table row or numbered
# item inside the section; a statement of a tabulated section that its table does not list
# takes the next free number.
# plan: the plan or plans that prove the requirement.
# gate (optional): the human gate of the goal contract (H1, H2 or H3) that must close before
# the requirement can be proven. Until a test proves it, the requirement is reported as open,
# never as passed.
#
# Section 16.1 lists tests of requirements stated elsewhere and has no entry. The Anthropic
# Console spend limit (last bullet of section 10.3) is an operational step and has no entry.

requirements:
- id: R-1-1
  section: '1'
  text: The disclaimer that pricing is illustrative and is not actuarial or insurance advice is shown in the interface, the term sheet and the README.
  plan: 05, 08, 09
- id: R-2-1
  section: '2'
  text: The broker types the exposure in the chat, picks an example, or clicks a point on the map.
  plan: 08
- id: R-2-2
  section: '2'
  text: The agent asks for anything essential that is missing (location, coverage window, limit) and does not assume these.
  plan: '06'
- id: R-2-3
  section: '2'
  text: The agent resolves the location and loads daily history, ingesting it on first use.
  plan: '06'
- id: R-2-4
  section: '2'
  text: The agent backtests the proposed index over every season available and reports how often it would have paid; the map moves to the point and shows the risk surface for that index.
  plan: 06, 08
- id: R-2-5
  section: '2'
  text: The agent runs the simulation and returns expected loss, tail payouts and an indicative premium, always citing the `quote_id`.
  plan: '06'
- id: R-2-6
  section: '2'
  text: The agent can surface the worst historical seasons for that window.
  plan: '06'
- id: R-2-7
  section: '2'
  text: The agent drafts the term sheet in English and Portuguese.
  plan: '06'
- id: R-2-8
  section: '2'
  text: The agent requests submission to a mock carrier, which creates a pending approval; only a person, through the Approvals panel, approves or rejects it.
  plan: 06, 08
- id: R-2-9
  section: '2'
  text: On approval a signed webhook is delivered to the mock carrier with retries, the receipt moves the quote to `submitted`, and every step is in the audit trail.
  plan: '06'
- id: R-3-1
  section: '3'
  text: 'The service is a modular monolith in Python: one FastAPI application, seven business modules with hard boundaries, shared infrastructure and one composition root.'
  plan: '00'
- id: R-3-2
  section: '3'
  text: 'Two deployable roles come from the same container image: `APP_ROLE=api` (the product) and `APP_ROLE=carrier` (the mock carrier).'
