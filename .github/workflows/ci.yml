# Every push and every pull request. The jobs call the same Make targets people run.
#
# Actions are pinned by full commit SHA; each SHA was resolved from the action's own
# repository with `git ls-remote --tags` on 2026-11-11 (the tag is in the comment).
# Container images are pinned by digest. `.github/scripts/check_delivery.py workflows`
# fails the build when a pin, the default permissions or a credential rule is broken.
name: CI

on:
  push:
  pull_request:

# The default for every job. No job in this workflow asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # gitleaks 8.30.1 and actionlint 1.7.12, resolved with `docker buildx imagetools inspect`
  # on 2026-11-11.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  checks:
    name: Lint, types, architecture, unit tests, mutation proof, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.12
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The unit suite includes the Terraform guardrails (marked `external`).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - name: Lint, types and boundaries
        run: make lint
      - name: Unit and architecture tests, frontend tests and type check
        run: make test
      - name: Typed client is up to date
        run: make gen-client CHECK=1
      - name: Frontend build
        run: pnpm --dir frontend build
      - name: Mutation proof
        run: make mutation-proof

  integration:
    name: Integration and failure tests (emulators, fault proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.12
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Integration tests against the emulators
        run: make test-integration
      - name: Failure campaign with the fault proxy (ports 8520 and 8521)
        run: make test-failure

  terraform:
    name: Terraform format, validation and guardrail tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      # No backend and no credentials: validation and the tests never reach Google Cloud.
      - name: Init without a backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
      - name: Guardrail tests (mocked provider, plan only)
        run: terraform -chdir=infra/terraform test

  hygiene:
    name: Secrets scan and delivery checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.12
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: gitleaks on the full history
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo "$GITLEAKS_IMAGE" git . --redact
      - name: gitleaks on the tree
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo "$GITLEAKS_IMAGE" dir . --redact
      - name: Workflows are pinned, read-only by default and free of credentials
        run: cd backend && uv run python ../.github/scripts/check_delivery.py workflows
      - name: Terraform holds no service account key
        run: cd backend && uv run python ../.github/scripts/check_delivery.py terraform-keys
      - name: README has its eleven sections and no dead link
        run: cd backend && uv run python ../.github/scripts/check_delivery.py readme
      - name: actionlint
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color
