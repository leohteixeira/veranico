# The load campaign of SPEC 16.5, on demand only.
#
# It has no input on purpose: the target is always the stack this job starts on its own
# runner (`make load`), never a remote address and never production.
name: Load

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load
  cancel-in-progress: false

jobs:
  load:
    name: k6 against the local stack, then the Firestore oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.12
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Run the campaign
        run: make load
      - name: Keep the run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ github.run_id }}
          path: .evidence/load/
          # `.evidence` starts with a dot.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
